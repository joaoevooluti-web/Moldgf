name: Android APK baseline
on:
  push:
    branches:
      - feature/befaco-modules
    paths:
      - "source/**"
      - ".github/workflows/build-android.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: source
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/befaco-modules
      - name: Run module graph contract tests
        run: node --test tests/*.test.cjs
      - name: Set up Emscripten
        uses: mymindstorm/setup-emsdk@v14
        continue-on-error: true
      - name: Build original Plaits and Beads WASM
        continue-on-error: true
        run: bash native/build_wasm.sh
      - name: Upload WASM build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wasm-log
          path: source/native/wasm_build.log
          if-no-files-found: ignore
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Run Android unit tests
        run: gradle testDebugUnitTest --no-daemon
      - name: Assemble debug APK
        run: gradle assembleDebug --no-daemon
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: eurorack-study-debug-apk
          path: source/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
      - name: Verify real Plaits and Beads WebAssembly payloads
        if: always()
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          (async () => {
            for (const [file, globalName] of [
              ['app/src/main/assets/plaits_wasm.js', 'PLAITS_WASM'],
              ['app/src/main/assets/beads_wasm.js', 'BEADS_WASM']
            ]) {
              const fullPath = path.resolve(file);
              if (!fs.existsSync(fullPath)) throw new Error('Missing WASM wrapper: ' + file);
              const source = fs.readFileSync(fullPath, 'utf8');
              const marker = 'window.' + globalName + '=\'';
              const start = source.indexOf(marker);
              const end = start < 0 ? -1 : source.indexOf('\';', start + marker.length);
              if (start < 0 || end < 0) throw new Error('Missing base64 payload: ' + file);
              const payload = source.slice(start + marker.length, end);
              if (!/^[A-Za-z0-9+/=]+$/.test(payload)) throw new Error('Invalid base64 payload: ' + file);
              const wasm = Buffer.from(payload, 'base64');
              if (wasm.length < 8 || wasm.subarray(0, 4).toString('hex') !== '0061736d') {
                throw new Error('Invalid WebAssembly magic/size: ' + file);
              }
              await WebAssembly.compile(wasm);
              console.log(file + ': valid WebAssembly, ' + wasm.length + ' bytes');
            }
          })().catch(error => { console.error(error); process.exit(1); });
          NODE
