function renderPs(){const L=psList();$('#pst').textContent=psM==='rack'?'Patches (rack inteiro)':'Presets — '+TY[psM.t].n;
 $('.psl').innerHTML=L.length?L.map((p,i)=>`<div data-i="${i}"><span>${esc(p.n)}${p.f?'<i>fábrica</i>':''}</span>${p.f?'':`<button data-d="${i}">${psDel===i?'Apagar?':'🗑'}</button>`}</div>`).join(''):'<div class="ps0">Nenhum preset salvo.</div>'}
function applyS(m,v){m.s=Object.assign(INIT[m.t](),JSON.parse(JSON.stringify(v)));dirty.add(m.id);sync();if(UI[m.t])UI[m.t](m)}
$('.psl').addEventListener('click',e=>{const d=e.target.closest('[data-d]');const L=psList(),nf=psFac().length;
 if(d){const i=+d.dataset.d;if(psDel===i){const t=psKey(),a=psGet(t);a.splice(i-nf,1);psSet(t,a);psDel=-1;toast('Apagado')}else psDel=i;renderPs();return}
 const r=e.target.closest('[data-i]');if(!r)return;const p=L[+r.dataset.i];if(!p)return;
 if(psM==='rack')loadRack(p.rack);else applyS(psM,p.s);toast('Carregado: '+p.n);$('#ps').hidden=true});
$('#pss').onclick=()=>{const t=psKey();let n=$('#psi').value.trim().slice(0,40);const a=psGet(t);if(!n)n=(psM==='rack'?'Patch ':'Preset ')+(a.length+1);
 const o=a.filter(x=>x.n!==n);o.push(psM==='rack'?{n,rack:JSON.parse(JSON.stringify(rackData()))}:{n,s:JSON.parse(JSON.stringify(psM.s))});psSet(t,o);$('#psi').value='';psDel=-1;renderPs();toast('Salvo: '+n+(LS.mem?' (só nesta sessão — armazenamento indisponível)':''))};
$('#psx').onclick=()=>{$('#ps').hidden=true};$('#ps').addEventListener('click',e=>{if(e.target.id==='ps')$('#ps').hidden=true});
function rackData(){return{v:2,mods:[...rk.children].filter(e=>e.classList&&e.classList.contains('mod')&&I[e.dataset.id]).map(e=>{const id=e.dataset.id;return{id,t:I[id].t,s:I[id].s}}),cab:cab.map(c=>[c.a,c.b])}}
function clearRack(){for(const id of Object.keys(I)){moKill(I[id]);I[id].el.remove();post({t:'del',id});delete I[id]}cab.length=0;for(const k in cnt)delete cnt[k];sel=null;rb();idx()}
function loadRack(d){clearRack();const map={};for(const x of d.mods||[]){if(!TY[x.t])continue;map[x.id]=add(x.t,Object.assign(INIT[x.t](),JSON.parse(JSON.stringify(x.s||{})))).id}
 const re=j=>{const p=j.indexOf('.'),id=map[j.slice(0,p)];return id?id+j.slice(p):null};
 for(const c of d.cab||[]){const a=re(c[0]),b=re(c[1]);if(a&&b&&jk[a]&&jk[b])cab.push({a,b})}
 if((d.v||1)<2&&!(d.mods||[]).some(x=>x.t==='out')){const mx=Object.keys(I).filter(k=>I[k].t==='mix');if(mx.length){const o=add('out');mx.forEach(k=>{cab.push({a:k+'.L',b:o.id+'.l'},{a:k+'.R',b:o.id+'.r'})})}}
 rb();sync();for(const k in I)dirty.add(k)}
function defaultRack(){clearRack();['mid','pam','sc','pl','mix','out'].forEach(t=>add(t));[['pam1.4','sc1.p'],['pam1.1','sc1.t'],['sc1.a','pl1.vo'],['sc1.to','pl1.t'],['pl1.o','mix1.i1'],['mix1.L','out1.l'],['mix1.R','out1.r']].forEach(([a,b])=>cab.push({a,b}));rb();sync()}
function exportJSON(name,obj){const text=JSON.stringify(obj,null,1);
 if(NAT&&NAT.exportFile){try{NAT.exportFile(name,'application/json',text)}catch(e){toast('Falha ao exportar')}return}
 openTx(0,text,name)}
$('#pse').onclick=()=>{if(psM==='rack')exportJSON('eurorack-patch.json',{format:'eurorack-rack',n:'Patch',rack:rackData()});
 else{const t=psM.t,a=[{n:'Estado atual',s:JSON.parse(JSON.stringify(psM.s))}].concat(psGet(t));exportJSON('eurorack-'+t+'-presets.json',{format:'eurorack-presets',type:t,presets:a})}};
$('#psa').onclick=()=>{const data={};for(const k of LS.keys())data[k]=LS.getItem(k);exportJSON('eurorack-backup.json',{format:'eurorack-backup',v:1,data,rack:rackData()})};
$('#psm').onclick=()=>{if(NAT&&NAT.importFile){NAT.importFile();return}openTx(1,'','')};
let pxN='export.json';
function openTx(imp,text,name){pxN=name||pxN;$('#pxt').textContent=imp?'Importar presets':'Exportar: '+pxN;$('#pxh').textContent=imp?'Cole aqui o conteúdo de um arquivo exportado, ou escolha o arquivo.':'Copie o texto e guarde num arquivo .json (ou use Baixar, se o navegador permitir).';
 const a=$('#pxa');a.value=text||'';a.readOnly=!imp;$('#pxc').hidden=!!imp;$('#pxd').hidden=!!imp;$('#pxf').hidden=!imp;$('#pxi').hidden=!imp;$('#px').hidden=false;if(!imp){a.focus();a.select()}}
$('#pxx').onclick=()=>{$('#px').hidden=true};
$('#pxc').onclick=async()=>{const a=$('#pxa');a.select();let ok=false;try{await navigator.clipboard.writeText(a.value);ok=true}catch(e){try{ok=document.execCommand('copy')}catch(e2){}}toast(ok?'Copiado':'Selecione o texto e copie manualmente')};
$('#pxd').onclick=()=>{try{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([$('#pxa').value],{type:'application/json'}));a.download=pxN;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1500)}catch(e){toast('Download indisponível: use Copiar')}};
$('#pxf').onclick=()=>{const i=document.createElement('input');i.type='file';i.accept='.json,application/json';i.onchange=()=>{const f=i.files[0];if(f)f.text().then(t=>{$('#pxa').value=t;toast('Arquivo lido — toque em Importar texto')})};i.click()};
$('#pxi').onclick=()=>{const t=$('#pxa').value.trim();if(!t){toast('Cole o texto primeiro');return}$('#px').hidden=true;importText(t)};
$('#psr').onclick=()=>{defaultRack();$('#ps').hidden=true;toast('Patch padrão carregado')};
function importText(txt){let d;try{d=JSON.parse(txt)}catch(e){toast('Arquivo inválido');return}
 try{if(d.format==='eurorack-presets'&&d.type&&Array.isArray(d.presets)){const a=psGet(d.type);let c=0;for(const p of d.presets){if(!p||!p.n||!p.s)continue;const o={n:String(p.n).slice(0,40),s:p.s},k=a.findIndex(x=>x.n===o.n);if(k>=0)a[k]=o;else a.push(o);c++}psSet(d.type,a);toast(c+' preset(s) importado(s)')}
 else if(d.format==='eurorack-rack'&&d.rack){const a=psGet('rack');a.push({n:String(d.n||'Patch importado').slice(0,40),rack:d.rack});psSet('rack',a);toast('Patch importado — abra Patches para carregar')}
 else if(d.format==='eurorack-backup'&&d.data){let c=0;for(const k in d.data){LS.setItem(k,d.data[k]);c++}if(d.rack)loadRack(d.rack);toast('Backup restaurado ('+c+' itens)')}
 else{toast('Formato não reconhecido');return}}catch(e){toast('Falha ao importar')}
 if(!$('#ps').hidden)renderPs()}
window.nativeImport=importText;
$('#pt').onclick=()=>openPs('rack');
// salvamento automático do rack (módulos, parâmetros e cabos)
let lastAuto='';function saveAuto(){try{const t=JSON.stringify(rackData());if(t!==lastAuto){LS.setItem('rack:auto',t);lastAuto=t}}catch(e){}}
window.saveAuto=saveAuto;setInterval(saveAuto,2500);document.addEventListener('visibilitychange',()=>{if(document.hidden)saveAuto()});addEventListener('pagehide',saveAuto);
// ---- reordenar módulos: segure a alça ⠿ e arraste (rola sozinho nas bordas; os cabos acompanham)
var md=null;
const mods_=()=>[...rk.children].filter(e=>e.classList&&e.classList.contains('mod'));
rk.addEventListener('pointerdown',e=>{if(md)return;const h=e.target.closest('.dh');if(!h)return;const el=h.closest('.mod');if(!el)return;e.preventDefault();
 const r=el.getBoundingClientRect();md={el,pid:e.pointerId,gx:e.clientX-r.left,tx:0,lx:e.clientX,raf:0};try{h.setPointerCapture(e.pointerId)}catch(x){}
 el.classList.add('drag');document.body.classList.add('dragging');mdMove();md.raf=requestAnimationFrame(mdTick)});
function mdMove(){const el=md.el,r=el.getBoundingClientRect(),lay=r.left-md.tx;md.tx=md.lx-md.gx-lay;el.style.transform='translateX('+md.tx+'px)';
 for(let g=0;g<4;g++){const L=mods_(),i=L.indexOf(el),cx=el.getBoundingClientRect().left+r.width/2;let nb=null,before=false;
  if(i>0){const q=L[i-1].getBoundingClientRect();if(cx<q.left+q.width/2){nb=L[i-1];before=true}}
  if(!nb&&i<L.length-1){const q=L[i+1].getBoundingClientRect();if(cx>q.left+q.width/2)nb=L[i+1]}
  if(!nb)break;const b0=nb.getBoundingClientRect().left;if(before)rk.insertBefore(el,nb);else rk.insertBefore(nb,el);
  const b1=nb.getBoundingClientRect().left;if(nb.animate&&b0!==b1)nb.animate([{transform:'translateX('+(b0-b1)+'px)'},{transform:'none'}],{duration:170,easing:'ease-out'});
  const lay2=el.getBoundingClientRect().left-md.tx;md.tx=md.lx-md.gx-lay2;el.style.transform='translateX('+md.tx+'px)'}
 dr()}
function mdTick(){if(!md)return;const w=$('#wrap'),wr=w.getBoundingClientRect(),z=70;let v=0;
 if(md.lx<wr.left+z)v=-Math.ceil((wr.left+z-md.lx)/6);else if(md.lx>wr.right-z)v=Math.ceil((md.lx-(wr.right-z))/6);
 if(v){const a=w.scrollLeft;w.scrollLeft+=v;if(w.scrollLeft!==a)mdMove()}md.raf=requestAnimationFrame(mdTick)}
addEventListener('pointermove',e=>{if(md&&e.pointerId===md.pid){md.lx=e.clientX;mdMove()}});
function mdEnd(e){if(!md||(e&&e.pointerId!==md.pid))return;cancelAnimationFrame(md.raf);const el=md.el;md=null;el.classList.remove('drag');el.style.transform='';document.body.classList.remove('dragging');dr();saveAuto()}
addEventListener('pointerup',mdEnd);addEventListener('pointercancel',mdEnd);
// ---- botão SEED do Beads: segurar gera grãos; toque curto desliga o modo latched; 4 s ligado religa
var hb=null;
rk.addEventListener('pointerdown',e=>{const h=e.target.closest('[data-hold]');if(!h||hb)return;const el=h.closest('.mod'),m=el&&I[el.dataset.id];if(!m)return;e.preventDefault();
 hb={m,t0:Date.now(),pid:e.pointerId};m.s.hd=1;dirty.add(m.id);try{h.setPointerCapture(e.pointerId)}catch(x){}});
function hbEnd(e){if(!hb||(e&&e.pointerId!==hb.pid))return;const m=hb.m,dur=Date.now()-hb.t0;hb=null;m.s.hd=0;dirty.add(m.id);
 if(m.s.sz<=.97){if(m.s.sl){if(dur<600)m.s.sl=0}else if(dur>=4000)m.s.sl=1}if(UI[m.t])UI[m.t](m)}
addEventListener('pointerup',hbEnd);addEventListener('pointercancel',hbEnd);
let restored=0;try{const a=LS.getItem('rack:auto');if(a){const d=JSON.parse(a);if(d&&d.mods&&d.mods.length){loadRack(d);restored=1}}}catch(e){restored=0}
if(!restored)defaultRack();requestAnimationFrame(ui);
